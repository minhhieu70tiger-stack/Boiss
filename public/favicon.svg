<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 512 512" width="100%" height="100%">
  <!-- Transparent Background Mascot Logo - No Frame, No Border -->
  <defs>
    <!-- Gradients for Mascot Elements -->
    <linearGradient id="chameleonSkin" x1="20%" y1="0%" x2="80%" y2="100%">
      <stop offset="0%" stop-color="#72E06A" />
      <stop offset="60%" stop-color="#40C24B" />
      <stop offset="100%" stop-color="#289A36" />
    </linearGradient>
    <linearGradient id="rocketBody" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#FFB338" />
      <stop offset="50%" stop-color="#FF7A1A" />
      <stop offset="100%" stop-color="#E64A19" />
    </linearGradient>
    <linearGradient id="rocketWing" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#29B6F6" />
      <stop offset="100%" stop-color="#0277BD" />
    </linearGradient>
    <linearGradient id="glassLens" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E1F5FE" stop-opacity="0.9" />
      <stop offset="50%" stop-color="#81D4FA" stop-opacity="0.5" />
      <stop offset="100%" stop-color="#29B6F6" stop-opacity="0.25" />
    </linearGradient>
    <linearGradient id="flame" x1="100%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#FFF176" />
      <stop offset="50%" stop-color="#FFA726" />
      <stop offset="100%" stop-color="#FF5722" />
    </linearGradient>
    <filter id="softGlow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="4" stdDeviation="6" flood-color="#000000" flood-opacity="0.25" />
    </filter>
  </defs>

  <g id="mascot-standalone" filter="url(#softGlow)">
    <!-- 1. Rocket Thruster Exhaust Flame Puff -->
    <g id="exhaust-smoke">
      <circle cx="82" cy="275" r="14" fill="url(#flame)" />
      <circle cx="95" cy="295" r="12" fill="url(#flame)" />
      <circle cx="70" cy="295" r="10" fill="#FFA726" />
      <circle cx="88" cy="260" r="8" fill="#FFF59D" />
    </g>

    <!-- 2. Rocket Backpack (Attached on Back) -->
    <g id="rocket-pack">
      <!-- Back Thruster Ring -->
      <path d="M 115 240 L 102 268 C 100 274 108 280 114 278 L 132 255 Z" fill="#37474F" stroke="#212121" stroke-width="4" stroke-linejoin="round" />
      <!-- Bottom Rocket Fin / Wing -->
      <path d="M 120 230 C 95 240, 85 270, 90 285 C 105 285, 125 270, 135 250 Z" fill="url(#rocketWing)" stroke="#1A237E" stroke-width="4" stroke-linejoin="round" />
      <!-- Top Rocket Fin / Wing -->
      <path d="M 175 140 C 160 115, 140 120, 135 135 C 145 155, 165 170, 185 168 Z" fill="url(#rocketWing)" stroke="#1A237E" stroke-width="4" stroke-linejoin="round" />
      <!-- Main Rocket Barrel -->
      <path d="M 125 255 C 140 220, 160 170, 205 145 C 235 125, 260 140, 265 165 C 230 195, 180 250, 135 262 Z" fill="url(#rocketBody)" stroke="#BF360C" stroke-width="5" stroke-linejoin="round" />
      <!-- Rocket Porthole Window -->
      <circle cx="195" cy="195" r="18" fill="#B0BEC5" stroke="#37474F" stroke-width="4" />
      <circle cx="195" cy="195" r="12" fill="#E0F7FA" stroke="#00838F" stroke-width="3" />
      <circle cx="192" cy="192" r="4" fill="#FFFFFF" />
    </g>

    <!-- 3. Chameleon Swirly Tail (Looping Dynamic Splash) -->
    <g id="tail">
      <path d="M 165 260 
               C 150 320, 160 385, 200 425 
               C 245 465, 315 460, 355 415 
               C 390 375, 380 315, 335 290 
               C 295 265, 245 280, 235 320 
               C 225 355, 250 385, 280 385 
               C 305 385, 320 365, 315 345 
               C 310 330, 290 330, 290 342 
               C 290 350, 298 355, 302 352
               C 285 365, 265 350, 268 332
               C 272 308, 305 295, 330 312
               C 362 335, 365 378, 335 408
               C 295 448, 235 445, 195 408
               C 165 372, 160 320, 180 270 Z" 
            fill="url(#chameleonSkin)" stroke="#1B5E20" stroke-width="6" stroke-linejoin="round" />
      <!-- Tail Texture Specks & Digital Pixels -->
      <circle cx="185" cy="340" r="3.5" fill="#1B5E20" />
      <circle cx="205" cy="380" r="4" fill="#1B5E20" />
      <circle cx="240" cy="415" r="4.5" fill="#1B5E20" />
      <circle cx="285" cy="425" r="4" fill="#1B5E20" />
      <!-- Water/Pixel Stream Swirl Effect -->
      <path d="M 330 380 C 355 350, 340 315, 305 315 C 275 315, 260 340, 285 360" fill="none" stroke="#4DD0E1" stroke-width="4" stroke-linecap="round" stroke-dasharray="6 4" />
      <rect x="245" y="395" width="8" height="8" rx="2" fill="#29B6F6" />
      <rect x="345" y="325" width="7" height="7" rx="2" fill="#FFB300" />
    </g>

    <!-- 4. Chameleon Body & Legs -->
    <g id="body-and-limbs">
      <!-- Main Body Torso -->
      <path d="M 180 250 
               C 195 210, 230 180, 275 175 
               C 310 170, 340 185, 360 215 
               C 375 240, 365 275, 340 295 
               C 305 320, 240 325, 195 295 
               C 180 285, 175 265, 180 250 Z" 
            fill="url(#chameleonSkin)" stroke="#1B5E20" stroke-width="6" stroke-linejoin="round" />

      <!-- Back Leg / Foot -->
      <path d="M 195 275 C 205 305, 215 315, 230 310 C 235 308, 238 298, 232 292 L 210 270 Z" fill="url(#chameleonSkin)" stroke="#1B5E20" stroke-width="4" stroke-linejoin="round" />
      <!-- Front Legs (Claws grasping) -->
      <path d="M 270 265 C 285 295, 298 305, 310 298 C 315 295, 312 285, 305 280 L 285 255 Z" fill="url(#chameleonSkin)" stroke="#1B5E20" stroke-width="4" stroke-linejoin="round" />
    </g>

    <!-- 5. Chameleon Head, Eye & Casque -->
    <g id="head-and-casque">
      <!-- Head Contour with Pointed Casque Crest -->
      <path d="M 265 175 
               C 275 125, 315 95, 345 105 
               C 365 112, 380 135, 395 155 
               C 420 185, 420 225, 395 255 
               C 375 275, 340 278, 305 265 
               C 275 250, 260 210, 265 175 Z" 
            fill="url(#chameleonSkin)" stroke="#1B5E20" stroke-width="6" stroke-linejoin="round" />

      <!-- Cute Happy Smile Mouth -->
      <path d="M 330 245 C 355 265, 390 255, 400 240" fill="#C62828" stroke="#1B5E20" stroke-width="4" stroke-linecap="round" />
      <!-- Pink Tongue Inside Smile -->
      <path d="M 345 252 C 365 268, 385 260, 390 246 Z" fill="#FF8A80" />

      <!-- Left Cute Eye (inside glasses) -->
      <circle cx="345" cy="180" r="34" fill="#FFFFFF" stroke="#1B5E20" stroke-width="4" />
      <circle cx="355" cy="180" r="18" fill="#212121" />
      <circle cx="360" cy="174" r="7" fill="#FFFFFF" />
      <circle cx="348" cy="188" r="3" fill="#FFFFFF" />

      <!-- Geeky Tortoise / Brown Eyeglasses Frame -->
      <circle cx="345" cy="180" r="38" fill="none" stroke="#4E342E" stroke-width="8" />
      <path d="M 305 175 C 290 172, 275 178, 268 185" fill="none" stroke="#4E342E" stroke-width="6" stroke-linecap="round" />
      <path d="M 382 178 L 405 178" fill="none" stroke="#4E342E" stroke-width="7" stroke-linecap="round" />
    </g>

    <!-- 6. Hand Holding Magnifying Glass (Looking through lens) -->
    <g id="magnifying-glass">
      <!-- Right Paw gripping handle -->
      <path d="M 390 265 C 405 265, 415 275, 410 290 C 405 298, 395 295, 388 285 Z" fill="url(#chameleonSkin)" stroke="#1B5E20" stroke-width="4" />
      
      <!-- Wooden Magnifier Handle -->
      <path d="M 402 260 L 425 320 C 428 328, 418 335, 412 330 L 392 270 Z" fill="#8D6E63" stroke="#3E2723" stroke-width="4" stroke-linejoin="round" />
      <line x1="398" y1="285" x2="418" y2="280" stroke="#FFD54F" stroke-width="4" />

      <!-- Big Metallic Lens Rim -->
      <circle cx="410" cy="185" r="54" fill="none" stroke="#37474F" stroke-width="12" />
      <circle cx="410" cy="185" r="48" fill="none" stroke="#90A4AE" stroke-width="4" />

      <!-- Glass Convex Lens (with Magnified Pupil Reflection) -->
      <circle cx="410" cy="185" r="46" fill="url(#glassLens)" />

      <!-- Magnified Big Curious Eye inside Lens -->
      <ellipse cx="415" cy="185" rx="34" ry="38" fill="#FFFFFF" />
      <ellipse cx="422" cy="185" rx="20" ry="24" fill="#212121" />
      <circle cx="430" cy="175" r="8" fill="#FFFFFF" />
      <circle cx="415" cy="195" r="3.5" fill="#FFFFFF" />

      <!-- Lens Light Glare Curves -->
      <path d="M 375 160 A 42 42 0 0 1 425 145" fill="none" stroke="#FFFFFF" stroke-width="5" stroke-linecap="round" opacity="0.8" />
      <path d="M 380 215 A 42 42 0 0 0 420 225" fill="none" stroke="#FFFFFF" stroke-width="3" stroke-linecap="round" opacity="0.5" />
    </g>
  </g>
</svg>
